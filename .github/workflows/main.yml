name: Build Android APK

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v5

    - name: Configurer Java (JDK 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # gradlew n'est pas dans le dépôt : on installe Gradle directement
    # (même version que gradle/wrapper/gradle-wrapper.properties)
    - name: Installer Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '9.3.1'

    # build.gradle.kts exige debug.keystore. S'il est dans le dépôt on le garde
    # (clé stable, nécessaire à la connexion Google), sinon on en génère un.
    - name: Préparer la clé de debug
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    # google-services.json n'est pas dans le dépôt : sans lui, la ressource
    # default_web_client_id n'existe pas et la compilation Kotlin échoue.
    # Fichier factice, créé seulement s'il est absent (la connexion Google
    # ne fonctionnera qu'avec le vrai fichier de ta console Firebase).
    - name: Créer un google-services.json factice si absent
      run: |
        if [ ! -f app/google-services.json ]; then
          cat > app/google-services.json <<'EOF'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "chessx-placeholder",
            "storage_bucket": "chessx-placeholder.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.aistudio.chessx.qwmzkv" }
              },
              "oauth_client": [
                { "client_id": "000000000000-placeholder.apps.googleusercontent.com", "client_type": 3 }
              ],
              "api_key": [ { "current_key": "placeholder" } ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": [
                    { "client_id": "000000000000-placeholder.apps.googleusercontent.com", "client_type": 3 }
                  ]
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF
        fi

    - name: Compiler l'APK (Debug)
      run: gradle assembleDebug --stacktrace

    - name: Sauvegarder l'APK (Artifact)
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
