name: Inspect lib
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: |
          B=https://repo1.maven.org/maven2/io/github/cvb941/kchesslib
          curl -sSL $B/1.0.5/ | grep -o 'href="[^"]*"' | head -20
          curl -sSL -o k.jar $B/1.0.5/kchesslib-1.0.5.jar; ls -la k.jar; head -c 200 k.jar | xxd | head -3
          unzip -l k.jar | head -60
          curl -sSL $B/1.0.5/kchesslib-1.0.5.pom | head -60
