name: Inspect lib
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: |
          B=https://repo1.maven.org/maven2/io/github/cvb941/kchesslib-jvm/1.0.5
          curl -sSL -o k.jar $B/kchesslib-jvm-1.0.5.jar; ls -la k.jar
          P=com.github.bhlangonijr.chesslib
          for c in Board Square Piece PieceType Side Bitboard; do echo "=== $c"; javap -cp k.jar -public $P.$c; done
          echo "=== Move"; javap -cp k.jar -public $P.move.Move
          echo "=== MoveList"; javap -cp k.jar -public $P.move.MoveList | head -40
